title: cp_tpl docs
description: Документация по JS-хелперам helpers.js для Tilda

# GitHub Pages project site
url: "https://avelkoskyeng.github.io"
baseurl: "/tilda"

# Docs theme
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
search_enabled: true
heading_anchors: true

# Search: split API pages into smaller searchable sections and index aliases/keywords.
search.heading_level: 3
search.previews: 3
search.preview_words_before: 5
search.preview_words_after: 12
search.rel_url: true
search.button: true
search.focus_shortcut_key: "k"
# Split dotted/underscored API names into useful tokens: cp_tpl.forms.selectAll -> cp tpl forms selectAll.
search.tokenizer_separator: /[\s\-\/\._]+/

# Top-right links
aux_links:
  GitHub:
    - "https://github.com/avelkoskyeng/tilda"
  helpers.js:
    - "https://github.com/avelkoskyeng/tilda/blob/main/helpers.js"
aux_links_new_tab: true

# Footer
footer_content: "cp_tpl docs · JS-хелперы для Tilda"
last_edit_timestamp: false

# GitHub Pages needs this plugin for remote_theme
plugins:
  - jekyll-remote-theme

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
