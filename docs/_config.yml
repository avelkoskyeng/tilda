title: cp_tpl docs
description: Документация по JS-хелперам helpers.js для Tilda

# GitHub Pages project site
url: "https://avelkoskyeng.github.io"
baseurl: "/tilda"

# Docs theme
remote_theme: just-the-docs/just-the-docs
color_scheme: dark
search_enabled: true
heading_anchors: true

# Top-right links
aux_links:
